<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b2aa8">
  <link rel="manifest" href="manifest.json">
  <title>Frios PA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Frios PA</div>
        <h1 id="pageTitle">Início</h1>
      </div>
      <button class="icon-btn" id="refreshBtn" aria-label="Atualizar" title="Atualizar">↻</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-page="home" class="nav-item active"><span class="nav-icon">⌂</span><span>Início</span></button>
      <button data-page="products" class="nav-item"><span class="nav-icon">▣</span><span>Produtos</span></button>
      <button data-page="expiry" class="nav-item"><span class="nav-icon">◷</span><span>Vencimentos</span></button>
      <button data-page="notifications" class="nav-item"><span class="nav-icon">♢</span><span>Alertas</span></button>
      <button data-page="settings" class="nav-item"><span class="nav-icon">⚙</span><span>Config.</span></button>
    </nav>
  </div>

  <div class="modal hidden" id="productModal">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Cadastro</div>
          <h2>Novo produto</h2>
        </div>
        <button class="close-btn" id="closeModal">×</button>
      </div>
      <form id="productForm">
        <label>Descrição<input id="description" required placeholder="Ex.: Leite pasteurizado"></label>
        <label>EAN<input id="ean" inputmode="numeric" placeholder="Digite ou leia o EAN"></label>
        <label>Data de vencimento<input id="expiryDate" type="date" required></label>
        <label>Tag de trabalho
          <select id="tag">
            <option value="7">7 dias</option>
            <option value="10">10 dias</option>
            <option value="12" selected>12 dias</option>
            <option value="15">15 dias</option>
            <option value="17">17 dias</option>
            <option value="20">20 dias</option>
            <option value="30">30 dias</option>
          </select>
        </label>
        <label>Foto<input id="photo" type="file" accept="image/*"></label>
        <div class="preview" id="photoPreview">Nenhuma foto selecionada</div>
        <button class="primary-btn" type="submit">Cadastrar produto</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
